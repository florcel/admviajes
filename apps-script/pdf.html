<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: A4; margin: 16mm 17mm 14mm; }
  body { font-family: Arial, Helvetica, sans-serif; color: #16181D; font-size: 11pt; margin: 0; }
  table { border-collapse: collapse; width: 100%; }
  .muted { color: #3F4652; }
  .eti { font-size: 8pt; font-weight: bold; color: #5B6270; text-transform: uppercase; letter-spacing: 0.5px; }
  .dato { font-size: 11pt; font-weight: bold; padding-bottom: 8px; }
  h1 { font-size: 24pt; margin: 14px 0 2px; }
  h2 { font-size: 13pt; margin: 0 0 6px; }
  ul { margin: 0; padding-left: 18px; }
  li { margin-bottom: 4px; }
  .notas li { font-size: 9pt; line-height: 1.4; color: #2A2F38; }
</style>
</head>
<body>
  <table>
    <tr>
      <td style="width: 50%; vertical-align: middle;">
        <? if (d.logo) { ?><img src="<?= d.logo ?>" style="height: 64px;"><? } else { ?><b style="font-size: 14pt;"><?= d.colegio ?></b><? } ?>
      </td>
      <td style="width: 50%; text-align: right; vertical-align: middle;">
        <div class="eti" style="color: #3F4652;">Presupuesto de salida educativa</div>
        <div class="muted" style="font-size: 10pt;">Año lectivo <?= d.anio ?> · <?= d.id ?></div>
      </td>
    </tr>
  </table>
  <table style="margin-top: 12px;">
    <tr>
      <td style="height: 4px; background: #16181D; width: 33%;"></td>
      <td style="height: 4px; background: #E30613; width: 34%;"></td>
      <td style="height: 4px; background: #F5C400; width: 33%;"></td>
    </tr>
  </table>

  <h1><?= d.nombre ?></h1>
  <div class="muted">Nivel <?= d.nivel ?><? if (d.curso) { ?> · <?= d.curso ?><? } ?></div>

  <table style="margin-top: 16px; border: 1px solid #DADDE3;">
    <tr>
      <td style="padding: 12px 14px 0; width: 50%;"><div class="eti">Fechas</div><div class="dato"><?= d.fechas ?></div></td>
      <td style="padding: 12px 14px 0; width: 50%;"><div class="eti">Duración</div><div class="dato"><?= d.duracion ?></div></td>
    </tr>
    <tr>
      <td style="padding: 4px 14px 6px;"><div class="eti">Transporte</div><div class="dato"><?= d.transporte || 'A confirmar' ?></div></td>
      <td style="padding: 4px 14px 6px;"><div class="eti">Acompañan</div><div class="dato"><?= d.docentes ? d.docentes + ' docentes' : 'A confirmar' ?></div></td>
    </tr>
  </table>

  <table style="margin-top: 18px;">
    <tr>
      <td style="width: 50%; vertical-align: top; padding-right: 16px;">
        <h2>El viaje incluye</h2>
        <ul>
          <? d.incluye.forEach(function (x) { ?><li><?= x ?></li><? }); ?>
        </ul>
      </td>
      <td style="width: 50%; vertical-align: top; background: #FFF6CC; border: 1px solid #EED77A; padding: 14px 16px;">
        <div style="font-size: 9.5pt; font-weight: bold; color: #4A3B00;">Valor total por alumno</div>
        <div style="font-size: 26pt; font-weight: bold; margin: 4px 0;"><?= d.valor ?></div>
        <div style="font-size: 10.5pt;"><?= d.periodo ?></div>
      </td>
    </tr>
  </table>

  <? if (d.notas.length) { ?>
  <div style="margin-top: 20px;">
    <h2 style="font-size: 11.5pt;">A tener en cuenta</h2>
    <ul class="notas">
      <? d.notas.forEach(function (n) { ?><li><?= n ?></li><? }); ?>
    </ul>
  </div>
  <? } ?>

  <table style="margin-top: 28px; border-top: 1px solid #DADDE3;">
    <tr>
      <td style="padding-top: 8px; font-size: 8.5pt; color: #3F4652;">Administración · <?= d.colegio ?> · <?= d.anio ?></td>
      <td style="padding-top: 8px; font-size: 8.5pt; color: #3F4652; text-align: right;">Documento para las familias</td>
    </tr>
  </table>
</body>
</html>
